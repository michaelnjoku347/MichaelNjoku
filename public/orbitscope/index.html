<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="/orbitscope/cesium/Widgets/widgets.css">
    <script src="/orbitscope/cesium/Cesium.js"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrbitScope</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="/orbitscope/portfolio-mock.js"></script>
    <script type="module" crossorigin src="/orbitscope/assets/index-DNstuTVq.js"></script>
    <link rel="stylesheet" crossorigin href="/orbitscope/assets/index-0Wq5qYZ5.css">
  </head>
  <body>
    <div id="globe"></div>
    <div class="hud">
      <div class="kicker">OrbitScope</div>
      <h1>Starlink from New York</h1>
      <div id="status" class="status">loading snapshot…</div>
    </div>
    <div class="panel">
      <label>
        find one
        <input id="search" type="search" placeholder="starlink-1234 or 25544" />
      </label>
      <div class="filters">
        <button data-filter="ALL" class="active">all</button>
        <button data-filter="STARLINK">starlink</button>
        <button data-filter="GPS">gps</button>
        <button data-filter="ISS">iss</button>
      </div>
      <div class="legend">
        <span><i class="dot starlink"></i> starlink</span>
        <span><i class="dot gps"></i> gps</span>
        <span><i class="dot iss"></i> iss</span>
        <span><i class="dot ground"></i> NY</span>
      </div>
      <div id="info" class="info">
        <p>Click a satellite. Pass times are from New York.</p>
        <p style="margin-top:.75rem;opacity:.8">Also in this project: <a href="/orbitscope/cubelight/" style="color:#3ee0c3">Cubelight</a> — a WASM ray tracer.</p>
      </div>
    </div>
  </body>
</html>
